[tool.pyright]
include = ["lcars", "programs"]
extraPaths = [".", "lcars", "programs"]
typeCheckingMode = "off"
reportMissingImports = false
reportMissingModuleSource = false
reportUndefinedVariable = false
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false

[tool.pylance]
typeCheckingMode = "off"
reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
norecursedirs = ["archive", ".venv", "demo", "data", "scripts", "build", "dist", ".devin"]
python_files = ["test_*.py", "*_test.py", "*.py", "Nova.py", "Terminal.py", "Desktop.py", "Control.py", "Network.py"]
python_classes = ["Test*", "*Suite", "*Test"]
python_functions = ["test_*", "Verify*", "test*"]


