metadata:
  id: core.klingon
  name: Klingon Core Systems
  version: 44.20.0
  faction: Klingon
  type: core
  category: 00

specs:
  capacity: 2048
  color_code: '#CC0000'
  security_level: 10
  priority: 1

entrypoints:
  main: lcars.klingon.core:InitializeKlingonCore
  combat: lcars.klingon.combat:InitializeCombat
  honor: lcars.klingon.honor:InitializeHonor

config:
  core:
    auto_start: true
    combat_mode: false
    honor_protocol: enabled
  combat:
    weapons_hot: false
    shields_priority: aggressive
    cloak_integration: true

paths:
  core_path: lcars/klingon/core
  combat_path: lcars/klingon/combat
  honor_path: lcars/klingon/honor

dependencies: []

interfaces:
  - KlingonCoreAPI
  - CombatAPI

boot:
  sequence:
    - init_honor
    - init_combat
    - init_core
  default_state: active

tags:
  - core
  - klingon
  - combat
  - honor
