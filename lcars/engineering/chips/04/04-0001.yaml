metadata:
  id: theme.klingon
  name: Klingon Battle Theme
  version: 44.20.0
  faction: Klingon
  type: theme
  category: 04

specs:
  capacity: 800
  color_code: '#CC0000'
  security_level: 5
  priority: 5

entrypoints:
  main: lcars.theme.klingon:InitializeKlingonTheme
  style: lcars.theme.klingon.style:LoadStyle
  battle: lcars.theme.klingon.battle:LoadBattleMode

config:
  theme:
    name: Klingon
    base_color: '#CC0000'
    accent_color: '#660000'
    dark_mode: true
    font: klingon_standard
  layout:
    rounded_corners: false
    button_style: aggressive
    panel_density: medium
    alert_animation: battle_stations

paths:
  theme_path: lcars/theme/klingon
  style_path: lcars/theme/klingon/style
  battle_path: lcars/theme/klingon/battle

dependencies:
  - modules.ui

interfaces:
  - ThemeAPI

boot:
  sequence:
    - init_ui
    - init_theme
  default_state: inserted

tags:
  - theme
  - klingon
  - battle
