metadata:
  id: theme.cardassian
  name: Cardassian Military Theme
  version: 44.20.0
  faction: Cardassian
  type: theme
  category: 04

specs:
  capacity: 800
  color_code: '#996600'
  security_level: 5
  priority: 5

entrypoints:
  main: lcars.theme.cardassian:InitializeCardassianTheme
  military: lcars.theme.cardassian.military:LoadMilitaryMode
  order: lcars.theme.cardassian.order:LoadOrderMode

config:
  theme:
    name: Cardassian
    base_color: '#996600'
    accent_color: '#663300'
    dark_mode: true
    font: cardassian_military
  layout:
    rounded_corners: false
    button_style: authoritative
    panel_density: high
    alert_animation: order_compliance
    observation_overlay: true

paths:
  theme_path: lcars/theme/cardassian
  military_path: lcars/theme/cardassian/military
  order_path: lcars/theme/cardassian/order

dependencies:
  - modules.ui

interfaces:
  - ThemeAPI

boot:
  sequence:
    - init_ui
    - init_theme
  default_state: inserted

tags:
  - theme
  - cardassian
  - military
  - order
