metadata:
  id: theme.romulan
  name: Romulan Stealth Theme
  version: 44.20.0
  faction: Romulan
  type: theme
  category: 04

specs:
  capacity: 800
  color_code: '#00CC00'
  security_level: 5
  priority: 5

entrypoints:
  main: lcars.theme.romulan:InitializeRomulanTheme
  style: lcars.theme.romulan.style:LoadStyle
  stealth: lcars.theme.romulan.stealth:LoadStealthMode

config:
  theme:
    name: Romulan
    base_color: '#00CC00'
    accent_color: '#006600'
    dark_mode: true
    font: romulan_cipher
  layout:
    rounded_corners: true
    button_style: minimal
    panel_density: low
    alert_animation: silent
    signature_masking: true

paths:
  theme_path: lcars/theme/romulan
  style_path: lcars/theme/romulan/style
  stealth_path: lcars/theme/romulan/stealth

dependencies:
  - modules.ui

interfaces:
  - ThemeAPI

boot:
  sequence:
    - init_ui
    - init_theme
  default_state: inserted

tags:
  - theme
  - romulan
  - stealth
